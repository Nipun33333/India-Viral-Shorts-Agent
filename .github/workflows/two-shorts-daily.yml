name: India Viral Shorts - two daily slots
on:
  schedule:
    # GitHub Actions cron is UTC: 04:30 = 10:00 IST; 12:30 = 18:00 IST.
    # GitHub schedules are best-effort and can be delayed.
    - cron: '30 4,12 * * *'
  workflow_dispatch:
    inputs:
      slot:
        description: '1, 2 or all'
        required: true
        default: '1'
        type: choice
        options: ['1', '2', 'all']
      backend:
        description: 'motion=automatic; yt_create_manual=join clips exported from YouTube Create'
        required: true
        default: 'motion'
        type: choice
        options: ['motion', 'yt_create_manual', 'flow_manual']
      publish:
        description: 'Upload the manual run to YouTube (private); default is preview only'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: india-shorts-${{ github.ref }}-${{ github.event.schedule || inputs.slot }}
  cancel-in-progress: false

jobs:
  create-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-3.5-flash-lite
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
      CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
      CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
      VIDEO_BACKEND: ${{ inputs.backend || 'motion' }}
      VIDEO_SLOT: ${{ inputs.slot || 'auto' }}
      AUTO_PUBLISH: ${{ github.event_name == 'schedule' || inputs.publish == true }}
      YOUTUBE_PRIVACY: private
      TTS_BACKEND: auto
      TRENDS_REGION: IN
      ENABLE_INSTAGRAM_PUBLISH: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install system requirements
        run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng fonts-noto-core fonts-freefont-ttf
      - name: Install Python packages
        run: pip install -r requirements.txt pytest
      - name: Run project tests
        run: python -m pytest -q
      - name: Run Indian trend-to-Shorts pipeline
        run: python -m shorts_agent.main
      - name: Preserve MP4, Gemini scripts, YouTube Create prompts and publish receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: india-shorts-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/
          if-no-files-found: warn
          retention-days: 14
