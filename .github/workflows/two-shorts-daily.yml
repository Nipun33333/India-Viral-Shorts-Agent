name: India Viral Shorts - two daily slots
on:
  schedule:
    # GitHub Actions cron is UTC: 04:30 = 10:00 IST; 12:30 = 18:00 IST.
    # GitHub schedules are best-effort and can be delayed.
    - cron: '30 4,12 * * *'
  workflow_dispatch:
    inputs:
      slot:
        description: '1, 2 or all'
        required: true
        default: '1'
        type: choice
        options: ['1', '2', 'all']
      backend:
        description: 'gemini_video=cloud AI video; motion=original graphics; manual modes use exported clips'
        required: true
        default: 'gemini_video'
        type: choice
        options: ['gemini_video', 'motion', 'yt_create_manual', 'flow_manual']
      publish:
        description: 'Upload the manual run to YouTube (private); default is preview only'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: india-shorts-${{ github.ref }}-${{ github.event.schedule || inputs.slot }}
  cancel-in-progress: false

jobs:
  create-and-upload:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip-short-test]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-3.5-flash-lite
      GEMINI_VIDEO_MODEL: ${{ vars.GEMINI_VIDEO_MODEL || 'gemini-omni-1.1-flash' }}
      GEMINI_VIDEO_TARGET_SECONDS: ${{ vars.GEMINI_VIDEO_TARGET_SECONDS || '20' }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
      CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
      CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
      VIDEO_BACKEND: ${{ inputs.backend || vars.VIDEO_BACKEND || 'motion' }}
      VIDEO_SLOT: ${{ inputs.slot || 'auto' }}
      AUTO_PUBLISH: ${{ github.event_name == 'schedule' || inputs.publish == true }}
      YOUTUBE_PRIVACY: private
      TTS_BACKEND: auto
      TRENDS_REGION: IN
      ENABLE_INSTAGRAM_PUBLISH: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install system requirements
        run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng fonts-noto-core fonts-freefont-ttf
      - name: Install Python packages
        run: pip install -r requirements.txt pytest
      - name: Run project tests
        run: python -m pytest -q
      - name: Check cloud video generation credentials
        if: env.VIDEO_BACKEND == 'gemini_video'
        shell: bash
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::gemini_video requires GEMINI_API_KEY in Settings > Secrets and variables > Actions."
            exit 1
          fi
          if [ "$GEMINI_VIDEO_TARGET_SECONDS" != "20" ] && [ "$GEMINI_VIDEO_TARGET_SECONDS" != "30" ]; then
            echo "::error::GEMINI_VIDEO_TARGET_SECONDS must be 20 or 30."
            exit 1
          fi
          echo "Cloud generation model: $GEMINI_VIDEO_MODEL"
          echo "Target duration: $GEMINI_VIDEO_TARGET_SECONDS seconds"
      - name: Check credentials before automatic publishing
        if: github.event_name == 'schedule' || inputs.publish == true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        shell: bash
        run: |
          missing=0
          for name in GEMINI_API_KEY YOUTUBE_API_KEY YOUTUBE_CLIENT_ID YOUTUBE_CLIENT_SECRET YOUTUBE_REFRESH_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::Required Actions secret is missing: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Add the missing secrets under Settings > Secrets and variables > Actions, then run again."
            exit 1
          fi
      - name: Run Indian trend-to-Shorts pipeline
        run: python -m shorts_agent.main
      - name: Preserve MP4, Gemini scripts, YouTube Create prompts and publish receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: india-shorts-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/
          if-no-files-found: warn
          retention-days: 14
