name: Android Emulator - one-time Google login test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-emulator-login-test
  cancel-in-progress: false

jobs:
  emulator-login:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      EMULATOR_VNC_PASSWORD: ${{ secrets.EMULATOR_VNC_PASSWORD }}

    steps:
      - name: Check VNC password secret
        shell: bash
        run: |
          if [ -z "${EMULATOR_VNC_PASSWORD}" ]; then
            echo "::error::Add the repository secret EMULATOR_VNC_PASSWORD before running this workflow."
            exit 1
          fi
          if [ "${#EMULATOR_VNC_PASSWORD}" -lt 16 ]; then
            echo "::error::EMULATOR_VNC_PASSWORD must be at least 16 characters."
            exit 1
          fi

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Install virtual display and remote-screen tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11vnc novnc websockify curl
          Xvfb :99 -screen 0 1280x800x24 -ac +extension GLX +render -noreset >/tmp/xvfb.log 2>&1 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      - name: Restore Android Virtual Device cache
        id: avd-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-googleplay-api35-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            avd-googleplay-api35-

      - name: Install Cloudflare Tunnel
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb -o /tmp/cloudflared.deb
          sudo dpkg -i /tmp/cloudflared.deb

      - name: Boot Play Store emulator and open temporary secure screen
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis_playstore
          arch: x86_64
          cores: 4
          ram-size: 4096M
          heap-size: 512M
          disk-size: 8G
          avd-name: login-test
          force-avd-creation: false
          emulator-boot-timeout: 600
          emulator-options: -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          enable-hw-keyboard: true
          script: |
            set -euo pipefail
            adb wait-for-device
            adb shell getprop sys.boot_completed

            x11vnc -storepasswd "$EMULATOR_VNC_PASSWORD" /tmp/x11vnc.pass
            x11vnc -display :99 -rfbauth /tmp/x11vnc.pass -forever -shared -rfbport 5900 -bg -o /tmp/x11vnc.log
            websockify --web=/usr/share/novnc/ 6080 localhost:5900 >/tmp/websockify.log 2>&1 &
            
            cloudflared tunnel --no-autoupdate --url http://localhost:6080 >/tmp/cloudflared.log 2>&1 &
            TUNNEL_PID=$!
            for i in $(seq 1 60); do
              TUNNEL_URL=$(grep -Eo 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/cloudflared.log | head -n 1 || true)
              if [ -n "$TUNNEL_URL" ]; then break; fi
              sleep 2
            done

            if [ -z "${TUNNEL_URL:-}" ]; then
              cat /tmp/cloudflared.log
              echo "::error::Could not create the temporary screen link."
              exit 1
            fi

            echo "============================================================"
            echo "ANDROID EMULATOR SCREEN (temporary link; password required):"
            echo "$TUNNEL_URL/vnc.html?autoconnect=true&resize=remote"
            echo "VNC password: the value you saved as repository secret EMULATOR_VNC_PASSWORD"
            echo "Open Google Play, sign in, and install YouTube Create if compatible."
            echo "This session stays open for 20 minutes."
            echo "============================================================"

            sleep 1200
            kill "$TUNNEL_PID" || true
            adb emu kill || true

      - name: Report cache status
        if: always()
        run: |
          echo "AVD cache hit: ${{ steps.avd-cache.outputs.cache-hit }}" >> "$GITHUB_STEP_SUMMARY"
          echo "This workflow is a one-time interactive login/cache experiment. It does not modify the existing Shorts publishing workflow." >> "$GITHUB_STEP_SUMMARY"
