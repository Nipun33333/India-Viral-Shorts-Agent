name: Android Emulator - one-time Google login test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-emulator-login-test
  cancel-in-progress: false

jobs:
  emulator-login:
    # Standard GitHub-hosted runners may not expose usable nested virtualization.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      EMULATOR_VNC_PASSWORD: ${{ secrets.EMULATOR_VNC_PASSWORD }}
      ANDROID_EMULATOR_WAIT_TIME_BEFORE_KILL: '120'

    steps:
      - name: Check VNC password secret
        shell: bash
        run: |
          if [ -z "${EMULATOR_VNC_PASSWORD}" ]; then
            echo "::error::Add the repository secret EMULATOR_VNC_PASSWORD before running this workflow."
            exit 1
          fi
          if [ "${#EMULATOR_VNC_PASSWORD}" -lt 16 ]; then
            echo "::error::EMULATOR_VNC_PASSWORD must be at least 16 characters."
            exit 1
          fi

      - name: Enable KVM access for the runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 666 /dev/kvm
          echo "KVM device:"
          ls -l /dev/kvm
          echo "CPU virtualization flags:"
          grep -E -m1 '(vmx|svm)' /proc/cpuinfo

      - name: Install virtual display and remote-screen tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11vnc novnc websockify curl libpulse0
          Xvfb :99 -screen 0 1280x800x24 -ac +extension GLX +render -noreset >/tmp/xvfb.log 2>&1 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      - name: Restore Android Virtual Device cache
        id: avd-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-googleplay-api35-ubuntu24-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            avd-googleplay-api35-ubuntu24-

      - name: Install Cloudflare Tunnel
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb -o /tmp/cloudflared.deb
          sudo dpkg -i /tmp/cloudflared.deb

      - name: Boot Play Store emulator and open temporary secure screen
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis_playstore
          arch: x86_64
          cores: 2
          ram-size: 3072M
          heap-size: 512M
          disk-size: 8G
          avd-name: login-test
          force-avd-creation: true
          emulator-boot-timeout: 1200
          emulator-options: -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          disable-animations: false
          enable-hw-keyboard: true
          disable-linux-hw-accel: false
          script: |
            adb wait-for-device
            adb shell getprop sys.boot_completed
            bash -lc 'set -eu; TUNNEL_URL=""; x11vnc -storepasswd "$EMULATOR_VNC_PASSWORD" /tmp/x11vnc.pass; x11vnc -display :99 -rfbauth /tmp/x11vnc.pass -forever -shared -rfbport 5900 -bg -o /tmp/x11vnc.log; websockify --web=/usr/share/novnc/ 6080 localhost:5900 >/tmp/websockify.log 2>&1 & cloudflared tunnel --no-autoupdate --url http://localhost:6080 >/tmp/cloudflared.log 2>&1 & TUNNEL_PID=$!; cleanup() { kill "$TUNNEL_PID" 2>/dev/null || true; adb emu kill 2>/dev/null || true; }; trap cleanup EXIT; for i in $(seq 1 60); do TUNNEL_URL=$(grep -Eo "https://[a-z0-9-]+[.]trycloudflare[.]com" /tmp/cloudflared.log | head -n 1 || true); if [ -n "$TUNNEL_URL" ]; then break; fi; sleep 2; done; if [ -z "$TUNNEL_URL" ]; then cat /tmp/cloudflared.log; echo "::error::Could not create the temporary screen link."; exit 1; fi; echo "============================================================"; echo "ANDROID EMULATOR SCREEN (temporary link; password required):"; echo "$TUNNEL_URL/vnc.html?autoconnect=true&resize=remote"; echo "VNC password: the value saved as repository secret EMULATOR_VNC_PASSWORD"; echo "Open Google Play and sign in. This session stays open for 20 minutes."; echo "============================================================"; sleep 1200'

      - name: Capture emulator diagnostics on failure
        if: failure()
        run: |
          echo "AVD cache hit: ${{ steps.avd-cache.outputs.cache-hit }}" >> "$GITHUB_STEP_SUMMARY"
          echo "KVM device:"
          ls -l /dev/kvm || true
          echo "Virtualization flags:"
          grep -E -m1 '(vmx|svm)' /proc/cpuinfo || true
          echo "Xvfb log:"
          cat /tmp/xvfb.log || true
          echo "Emulator processes:"
          pgrep -af emulator || true
          echo "ADB devices:"
          adb devices -l || true

      - name: Report cache status
        if: always()
        run: |
          echo "AVD cache hit: ${{ steps.avd-cache.outputs.cache-hit }}" >> "$GITHUB_STEP_SUMMARY"
          echo "This is a one-time interactive login/cache experiment. It does not modify the Shorts publishing workflow." >> "$GITHUB_STEP_SUMMARY"
